name: FTP access check (temporary)

# Read-only: connects with the FTP secrets and lists folders. Nothing is
# uploaded or deleted. Removed once the check has been read.
on:
  push:
    paths:
      - '.github/workflows/ftp-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List the FTP server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          for name in FTP_HOST FTP_USER LFTP_PASSWORD FTP_DIR; do
            if [ -z "${!name}" ]; then echo "SECRET MISSING: ${name/LFTP_PASSWORD/FTP_PASSWORD}"; else echo "secret set: ${name/LFTP_PASSWORD/FTP_PASSWORD}"; fi
          done
          echo "FTP_DIR=[$FTP_DIR]"
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$FTP_USER,$LFTP_PASSWORD" "ftp://$FTP_HOST:21" <<LFTP
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          debug 2
          pwd
          ls /
          ls "$FTP_DIR"
          bye
          LFTP
